name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Read-only by default: nothing in CI needs to write to the repository.
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The version must be the same in both Cargo.toml files, Cargo.lock and the winget manifest.
      - run: ./scripts/version.ps1 check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Known-vulnerable dependencies (RustSec). Its own job: a new advisory shouldn't hide
  # whether the code itself builds and passes.
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

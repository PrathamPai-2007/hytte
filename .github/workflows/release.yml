name: release
on:
  push:
    tags: ["v*"]
  # Manual release: GitHub creates the tag at the chosen commit when the release is published.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
      dry_run:
        description: "Build and check everything, but publish nothing and commit nothing"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # The ARM64 exe is built and checked on a real ARM runner (it can't run on x64), then handed to
  # the build job, which publishes everything together.
  arm64:
    runs-on: windows-11-arm
    env:
      # rust-toolchain.toml pins the x64 host; here the host is ARM64.
      RUSTUP_TOOLCHAIN: stable-aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The ARM image may not carry Rust.
      - name: Rust
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install stable-aarch64-pc-windows-msvc --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace
      - run: cargo build --release -p hytte
      - name: Check the version it reports
        shell: pwsh
        run: |
          $v = "${{ inputs.tag || github.ref_name }}".TrimStart("v")
          $got = & target\release\hytte.exe --version
          if ($got -ne "hytte $v") { throw "tag v$v but the ARM64 exe reports '$got'" }
          Copy-Item target\release\hytte.exe hytte-arm64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hytte-arm64
          path: hytte-arm64.exe

  build:
    needs: arm64
    # Publishing the release needs write access; the other steps don't use it.
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Before spending a build: the tag, both Cargo.toml files, Cargo.lock, the winget manifest and
      # the Scoop manifest agree.
      - run: ./scripts/version.ps1 check "${{ inputs.tag || github.ref_name }}"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hytte-arm64
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ inputs.tag || github.ref_name }}".TrimStart("v")
          # The built exe must say the tag's version, or the in-app updater would refuse it.
          $got = & target\release\hytte.exe --version
          if ($got -ne "hytte $v") { throw "tag v$v but the exe reports '$got'; bump crates/hytte/Cargo.toml" }
          Compress-Archive target\release\hytte.exe "hytte-$v-x64.zip"
          Copy-Item target\release\hytte.exe hytte.exe
          # The ARM64 zip holds the exe under the same name, so winget and Scoop treat both alike.
          $arm = Join-Path $env:RUNNER_TEMP "arm"
          New-Item -ItemType Directory $arm | Out-Null
          Copy-Item hytte-arm64.exe (Join-Path $arm "hytte.exe")
          Compress-Archive (Join-Path $arm "hytte.exe") "hytte-$v-arm64.zip"
      # 1.6.0 installs only run a download whose minisign signature checks out against the public
      # key built into that exe, and 1.6.1 and later never check. Releases keep signing the x64
      # exe (harmless, and it keeps any 1.6.0 install able to update). The secret key lives only in
      # this repository's secrets.
      - name: Sign hytte.exe
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if (-not $env:MINISIGN_SECRET_KEY) { throw "the MINISIGN_SECRET_KEY secret is not set" }
          cargo install rsign2 --version 0.6.7 --locked
          $key = Join-Path $env:RUNNER_TEMP "hytte.key"
          Set-Content -Path $key -Value $env:MINISIGN_SECRET_KEY -Encoding ascii
          rsign sign -W -s $key -x hytte.exe.minisig -t "hytte.exe" hytte.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item $key
          # What was just signed must verify with the key every 1.6.0 install trusts.
          $pub = "RWRhYIiFU0f4WrWEqRoBmoQycFtz0quv7vxbJLiej9Q6XuKDS/hCx/ZP"
          rsign verify hytte.exe -x hytte.exe.minisig -P $pub
          if ($LASTEXITCODE -ne 0) { throw "the signature doesn't verify with the 1.6.0 public key" }
      # hytte.exe / hytte-arm64.exe on their own are what the in-app updater downloads; the zips
      # are for people, winget and Scoop.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: ${{ !inputs.dry_run }}
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Hytte ${{ inputs.tag || github.ref_name }}
          files: |
            hytte-*-x64.zip
            hytte-*-arm64.zip
            hytte.exe
            hytte-arm64.exe
            hytte.exe.minisig
          generate_release_notes: true

  # The winget and Scoop manifests need the SHA-256 of the zips that were just published. Take
  # them from the published assets themselves (what winget and Scoop will download) and commit
  # them to main.
  manifests:
    needs: build
    if: ${{ !inputs.dry_run }}
    # Commits the manifest hashes to main.
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Fill in the hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $dir = Join-Path $env:RUNNER_TEMP "dl"
          gh release download $tag --repo "${{ github.repository }}" --pattern "hytte-*.zip" --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "couldn't download the published zips" }
          foreach ($zip in Get-ChildItem $dir -Filter "hytte-*.zip") { ./scripts/version.ps1 hash $zip.FullName }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (git status --porcelain manifests/winget bucket) {
            git add manifests/winget/Hytte.Hytte.yaml bucket/hytte.json
            git commit -m "manifests: hashes for $($tag.TrimStart('v'))"
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            Write-Host "the manifests already have these hashes"
          }

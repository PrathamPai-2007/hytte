[package]
name = "hytte"
version = "1.2.1"
edition = "2021"
build = "build.rs"

[[bin]]
name = "hytte"
path = "src/main.rs"

[dependencies]
hytte-proto = { path = "../proto" }
windows = { workspace = true }
windows-core = "0.62.2"
windows-numerics = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
image = { workspace = true }
miniz_oxide = "0.8"

[build-dependencies]
embed-resource = "3"

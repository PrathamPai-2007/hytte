name = "Docker"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File containers.ps1"
every = 60

# An unhealthy row names this one: "action": "restart", "arg": the container's name. Hytte passes
# the arg as the environment variable HYTTE_ARG. Needs one more click ("Sure?") before it runs.
[[action]]
name = "restart"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File restart.ps1"
confirm = true
timeout = 120

# The pane's "Fix unhealthy" button names this one. Same "Sure?" step.
[[action]]
name = "restart-unhealthy"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File restart-unhealthy.ps1"
confirm = true
timeout = 120

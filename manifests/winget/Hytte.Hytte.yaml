PackageIdentifier: Hytte.Hytte
PackageVersion: 1.9.0
PackageLocale: en-US
Publisher: Hytte
PackageName: Hytte
PackageUrl: https://github.com/PrathamPai-2007/hytte
License: MIT
ShortDescription: Lightweight dynamic notch for Windows 11.
Description: >-
  Hytte is a small pill at the top of the screen that shows long-running
  commands, AI agents waiting for input, dev servers, music and a file shelf.
  It never steals focus and idles at about 0.2% CPU. One program: `hytte` starts
  the pill, `hytte run -- <cmd>` and friends talk to it from the terminal.
